services:
  - type: web
    name: skill-tern-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix server
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://sofipepzeihogesdlwuz.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
